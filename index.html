<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101519" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalem Kalem">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a3990'/%3E%3Cpath d='M18 22h28M18 32h28M18 42h18' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Kalem Kalem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one ledger column that opens on the month's net figure; the entry form is a side panel on wide
   screens and a bottom sheet on phones. Totals carry the bookkeeper's rule: single line above, double below. */
:root{
  --bg:#eef1ee; --surface:#f7f9f7; --raised:#ffffff; --ink:#16221e; --mute:#5a6a64; --line:#d2dad5;
  --accent:#2a3990; --on-accent:#ffffff; --in:#0d7650; --out:#bd3829; --cash:#85610c; --card:#33568a; --shade:rgba(22,34,30,.45);
  --c0:#c0392b; --c1:#1e8a5a; --c2:#cf6f12; --c3:#2f6fbf; --c4:#7b4bb3; --c5:#8a5a3a; --c6:#c2457f; --c7:#127f7f; --c8:#857f14; --c9:#5d6b78;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101519; --surface:#161c21; --raised:#1d252b; --ink:#e9edeb; --mute:#95a29d; --line:#2a343b;
    --accent:#98a5ff; --on-accent:#0d1230; --in:#55cf9d; --out:#ff8172; --cash:#dcb65c; --card:#93b4ea; --shade:rgba(0,0,0,.62);
    --c0:#ff7b6e; --c1:#56cf9a; --c2:#f5a34f; --c3:#6fa8f0; --c4:#b08ae6; --c5:#c79a78; --c6:#f07fb0; --c7:#4fc9c9; --c8:#cfc95a; --c9:#9aa8b5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101519; --surface:#161c21; --raised:#1d252b; --ink:#e9edeb; --mute:#95a29d; --line:#2a343b;
  --accent:#98a5ff; --on-accent:#0d1230; --in:#55cf9d; --out:#ff8172; --cash:#dcb65c; --card:#93b4ea; --shade:rgba(0,0,0,.62);
  --c0:#ff7b6e; --c1:#56cf9a; --c2:#f5a34f; --c3:#6fa8f0; --c4:#b08ae6; --c5:#c79a78; --c6:#f07fb0; --c7:#4fc9c9; --c8:#cfc95a; --c9:#9aa8b5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd{margin:0}
.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.in{color:var(--in)} .out{color:var(--out)} .mute{color:var(--mute)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.brand b{display:block;font:500 21px/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap}
#status{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);margin-top:-2px}
#status i{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
#status.ok i{background:var(--in)} #status.warn i{background:var(--cash)} #status.bad i{background:var(--out)}
.month{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.month button{background:none;border:0;min-height:40px;cursor:pointer}
.month .ch{width:38px;display:grid;place-items:center}
.month .lbl{font:600 14.5px var(--body);padding:0 2px;min-width:104px;text-align:center}
.icb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}

.cols{display:grid;gap:36px;padding-top:26px}
.cols>*{min-width:0}
.eyebrow{font:600 11.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.net{font:400 clamp(44px,13vw,68px)/1.02 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.025em;margin-top:6px;display:inline-block;padding-bottom:10px;border-bottom:4px double var(--ink)}
.net small{font-size:.42em;letter-spacing:0;color:var(--mute)}
.net.neg{color:var(--out);border-bottom-color:var(--out)}
.io{display:grid;grid-template-columns:repeat(3,minmax(0,auto));justify-content:start;gap:8px 30px;margin-top:20px}
.io dt{font-size:12.5px;color:var(--mute)}
.io dd{font:600 17px var(--body);font-variant-numeric:tabular-nums}
.wallet{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:18px}
.wallet span{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.wallet b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.wallet .cash svg{color:var(--cash)} .wallet .card svg{color:var(--card)}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:20px;border-radius:12px;border:1px dashed var(--cash);font-size:13.5px}

.tabs{display:flex;gap:22px;margin-top:26px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 0 11px;font:600 15px var(--body);color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.chip{min-height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:transparent;font:500 13.5px var(--body);color:var(--mute);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip svg{width:16px;height:16px}
.fsel,.fq{min-height:36px;border-radius:99px;border:1px solid var(--line);background:var(--surface);padding:0 13px;font-size:13.5px;min-width:0}
.fq{flex:1 1 150px}
.sep{width:1px;height:20px;background:var(--line)}

.day{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:26px;padding-bottom:7px;border-bottom:1px solid var(--ink)}
.day h3{font:500 19px/1.2 var(--display)}
.day h3 span{font:500 12.5px var(--body);color:var(--mute);margin-left:8px;letter-spacing:.02em}
.day em{font:600 13.5px var(--body);font-style:normal;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 11px;align-items:baseline;width:100%;padding:11px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.it:hover{background:var(--surface)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.it .dot{transform:translateY(-1px)}
.it .l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.it .nm{font-weight:600;white-space:nowrap}
.it .lead{flex:1;min-width:14px;border-bottom:1px dotted var(--mute);opacity:.55;transform:translateY(-4px)}
.it .amt{font:600 15.5px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.it .amt svg{width:16px;height:16px}
.it .amt .cash{color:var(--cash)} .it .amt .card{color:var(--card)}
.it .nt{grid-column:2/-1;font-size:13.5px;color:var(--mute);overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;margin-top:14px;padding-top:9px;border-top:1px solid var(--ink);border-bottom:4px double var(--ink);padding-bottom:9px;font-size:13.5px;color:var(--mute)}
.foot b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{margin-top:34px;padding:34px 22px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.empty h3{font:500 24px/1.2 var(--display);text-wrap:balance}
.empty p{color:var(--mute);margin:8px auto 18px;max-width:44ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.btn{min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font:600 14.5px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--out);border-color:var(--out);background:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.sec{margin-top:34px}
.sec h3{font:500 21px/1.2 var(--display)}
.sec>p{color:var(--mute);font-size:13.5px;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;max-width:460px}
.cal span{font:600 11px var(--body);letter-spacing:.08em;color:var(--mute);text-align:center;padding-bottom:4px}
.cal button,.cal i{aspect-ratio:1;position:relative;border:0;background:var(--surface);border-radius:10px;display:grid;place-items:center;font:500 13px var(--body);font-variant-numeric:tabular-nums;font-style:normal;cursor:pointer;padding:0}
.cal i{background:none;cursor:default}
.cal button::before{content:"";position:absolute;width:calc(var(--s,0)*88%);aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--out) 30%,transparent)}
.cal button b{position:relative;font-weight:500}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.inc::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--in)}
.bars{display:grid;gap:11px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.bar .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bar .v small{font-weight:500;color:var(--mute);margin-left:6px}
.bar .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px;background:var(--c);min-width:2px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:14px;background:var(--surface)}
.split i{display:block;height:100%}
.split .a{background:var(--cash)} .split .b{background:var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:10px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend b{font-variant-numeric:tabular-nums}
.trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px;align-items:end;height:150px;border-bottom:1px solid var(--ink)}
.trend div{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.trend i{display:block;width:38%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.trend i.a{background:var(--in)} .trend i.b{background:var(--out)}
.trl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px;text-align:center;font-size:12.5px;color:var(--mute)}
.trl b{display:block;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px;margin-top:14px}
.facts dt{font-size:12.5px;color:var(--mute)}
.facts dd{font:600 16px var(--body);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bud{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.bud .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.bud .st{grid-column:1/-1;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bud .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.bud .tr i{display:block;height:100%;border-radius:4px;background:var(--c)}
.bud.over .tr i{background:var(--out)} .bud.over .st{color:var(--out)}
.inp{min-height:42px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--raised);padding:0 12px;min-width:0}
.inp.r{text-align:right;font-variant-numeric:tabular-nums}

/* kayıt formu */
.entry{background:var(--raised);border:1px solid var(--line)}
.entry h2{font:500 23px/1.2 var(--display)}
.entry form{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.entry form>*{min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--bg)}
.seg button{min-height:40px;min-width:0;padding:0 4px;border:0;border-radius:9px;background:none;font:600 14px var(--body);color:var(--mute);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.amount i{font:400 30px var(--display);font-style:normal;color:var(--mute)}
.amount input{flex:1;min-width:0;border:0;background:none;font:400 42px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:0;outline:none}
.amount:focus-within{border-bottom-color:var(--accent)}
.lab{font:600 11.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:8px}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{min-height:38px;padding:0 13px 0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;font:500 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px var(--c);font-weight:600}
.drow{display:flex;gap:8px;flex-wrap:wrap}
.drow .inp{flex:1 1 150px;width:auto}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .pri{flex:1 1 150px}
.err{color:var(--out);font-size:13.5px;min-height:0}

.fab{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));min-height:54px;padding:0 26px 0 20px;border-radius:27px;border:0;background:var(--accent);color:var(--on-accent);font:600 16px var(--body);display:inline-flex;align-items:center;gap:9px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.fab svg{width:21px;height:21px;stroke-width:2.2}
.scrim{position:fixed;inset:0;z-index:20;background:var(--shade)}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--raised);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h2{font:500 25px/1.2 var(--display)}
.sheet h3{font:500 19px/1.2 var(--display);margin-top:28px}
.sheet h3+p{font-size:13.5px;color:var(--mute);margin-top:2px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;cursor:pointer}
.sw i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.crow.off .inp{opacity:.5;text-decoration:line-through}
.addc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.two label span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
textarea.inp{min-height:110px;padding:10px 12px;font:12px ui-monospace,Menlo,monospace;margin-top:10px}
.toasts{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.cmd{display:flex;align-items:center;gap:8px;margin-top:24px;padding:6px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.cmd:focus-within{border-color:var(--accent)}
.cmd input{flex:1;min-width:0;border:0;background:none;min-height:42px;padding:0 8px;outline:none;font-size:15px}
.cmd .mic,.cmd .go{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.cmd .mic{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cmd .mic.on{background:var(--out);color:var(--bg);animation:pulse 1.4s infinite}
.cmd .go{background:var(--accent);color:var(--on-accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--out) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.hintc{margin-top:8px;font-size:13px;color:var(--mute)}
.cmdout{margin-top:10px;font-size:14px;display:grid;gap:6px}
.cmdout:empty{display:none}
.cmdout .ln{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cmdout .ln b{font-variant-numeric:tabular-nums}
.cmdout .ln .sp{flex:1}
.lnk{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px 24px;margin-top:16px}
.kpis dt{font-size:12.5px;color:var(--mute)}
.kpis dd{font:500 26px/1.15 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.callout{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.callout.warn{border-color:var(--cash)}
details.cu{border-bottom:1px solid var(--line)}
details.cu summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 0;align-items:baseline}
details.cu summary::-webkit-details-marker{display:none}
details.cu .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
details.cu .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
details.cu .v small{font-weight:500;color:var(--mute);margin-left:6px}
details.cu .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
details.cu .tr i{display:block;height:100%;border-radius:4px;background:var(--c);min-width:2px}
details.cu .meta{grid-column:1/-1;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
details.cu .pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 12px;padding:2px 0 14px 17px;font-size:13.5px}
details.cu .pay span:nth-child(3n){font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
details.cu .pay span:nth-child(3n+2){color:var(--mute);overflow-wrap:anywhere}
.stack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px;height:160px;border-bottom:1px solid var(--ink)}
.stack div{display:flex;flex-direction:column-reverse;height:100%;align-items:center}
.stack i{display:block;width:62%;max-width:44px;background:var(--c);flex:none}
.stack i:last-child{border-radius:4px 4px 0 0}
.ai{margin-top:14px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);white-space:pre-wrap;font-size:14.5px;line-height:1.6}
span.sw{cursor:default}

@media (max-width:899px){
  .entry{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;border-bottom:0;
    padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);visibility:hidden}
  body.fopen .entry{transform:none;visibility:visible}
  .io{grid-template-columns:repeat(2,minmax(0,auto))}
}
@media (min-width:900px){
  .app{padding-block:0 60px}
  .cols{grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start;padding-top:34px}
  .entry{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);border-radius:20px;padding:24px}
  .fab,#fCancel{display:none}
  body.editing #fCancel{display:inline-flex}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 40px));max-height:86%;border-radius:22px;border-bottom:1px solid var(--line);padding:28px}
  .toasts{bottom:28px}
}
@media (max-width:420px){.month .lbl{min-width:92px;font-size:13.5px}.brand b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><b>Kalem Kalem</b></div>
    <div class="month"><button class="ch" data-act="mon" data-v="-1" aria-label="Önceki ay"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button><button class="lbl" id="monLbl" data-act="mon" data-v="0" title="Bu aya dön"></button><button class="ch" data-act="mon" data-v="1" aria-label="Sonraki ay"><svg class="i" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button></div>
    <button class="icb" data-act="settings" aria-label="Ayarlar"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    <p id="status"><i></i><span>Kayıtlar yükleniyor</span></p>
  </header>
  <div class="cols">
    <main>
      <section id="sum"></section>
      <form class="cmd" id="cmd" autocomplete="off"><button type="button" class="mic" id="mic" data-act="mic" aria-label="Sesle söyle" aria-pressed="false" hidden><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></svg></button><input id="cmdIn" enterkeyhint="send" placeholder="Söyle ya da yaz: kartla 250 lira market" aria-label="Sesli ya da yazılı komut"><button class="go" type="submit" aria-label="Komutu işle"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
      <p class="hintc">Örnek: “dün nakit 120 lira kahve”, “Ahmet Bey'den 5.000 lira geldi”, “ATM'den 2.000 çektim”, “müşteri raporu”.</p>
      <div class="cmdout" id="cmdOut" aria-live="polite"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <section id="view"></section>
    </main>
    <aside class="entry" id="entry" aria-label="Kayıt formu">
      <form id="f" novalidate>
        <h2 id="fTitle">Yeni kayıt</h2>
        <div class="seg" id="fType" role="group" aria-label="Kayıt türü"></div>
        <label class="amount" for="fAmt"><i>₺</i><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Tutar"></label>
        <div id="fCatWrap"><span class="lab">Kategori</span><div class="cats" id="fCats"></div></div>
        <div id="fCuWrap" hidden><label class="lab" for="fCu">Müşteri</label><div class="drow"><select class="inp" id="fCu"></select><input class="inp" id="fCuNew" placeholder="Yeni müşteri adı" maxlength="40" autocomplete="off" hidden></div></div>
        <div><span class="lab" id="fMethLab">Ödeme</span><div class="seg" id="fMeth" role="group"></div></div>
        <div><label class="lab" for="fDate">Tarih</label><div class="drow"><input class="inp" type="date" id="fDate"><button type="button" class="btn sm" data-act="fday" data-v="0">Bugün</button><button type="button" class="btn sm" data-act="fday" data-v="-1">Dün</button></div></div>
        <div><label class="lab" for="fNote">Not</label><input class="inp" id="fNote" maxlength="140" placeholder="Nereden, ne için" autocomplete="off"></div>
        <p class="err" id="fErr" role="alert"></p>
        <div class="acts"><button class="btn pri" type="submit" id="fSave">Kaydet</button><button class="btn" type="button" id="fCopy" data-act="fcopy" hidden>Bugüne kopyala</button><button class="btn danger" type="button" id="fDel" data-act="fdel" hidden>Sil</button><button class="btn" type="button" id="fCancel" data-act="fclose">Vazgeç</button></div>
      </form>
    </aside>
  </div>
</div>
<button class="fab" id="fab" data-act="fnew"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Kayıt ekle</button>
<div class="scrim" id="scrim" data-act="scrim" hidden></div>
<div class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-label="Ayarlar" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
document.documentElement.lang='tr';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const LKEY='kalemkalem.v1', PAL=10;
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const IC={
  cash:'<svg class="i cash" viewBox="0 0 24 24" aria-label="Nakit"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v.01M18 14.5v.01"/></svg>',
  card:'<svg class="i card" viewBox="0 0 24 24" aria-label="Kart"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></svg>',
  swap:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const DEF_CATS=[['g1','Market','gider',1],['g2','Yeme içme','gider',2],['g3','Ulaşım','gider',3],['g4','Akaryakıt','gider',8],['g5','Faturalar','gider',4],['g6','Kira','gider',5],['g7','Sağlık','gider',0],['g8','Giyim','gider',6],['g9','Eğlence','gider',7],['g10','Eğitim','gider',3],['g11','Araç bakım','gider',5],['g12','Diğer','gider',9],['i1','Maaş','gelir',1],['i2','Ek gelir','gelir',7],['i3','Diğer gelir','gelir',9]]
  .map(a=>({id:a[0],n:a[1],t:a[2],k:a[3]}));
const defSettings=()=>({v:1,cats:clone(DEF_CATS),bud:{},open:{nakit:0,kart:0},cust:[]});

/* ───── para ve tarih ───── */
const fmt=(k,sign)=>{const v=Math.abs(k)/100,s=v.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});return (k<0?'−':sign&&k>0?'+':'')+'₺'+s};
const fmt0=k=>(k<0?'−':'')+'₺'+Math.round(Math.abs(k)/100).toLocaleString('tr-TR');
const moneyHtml=(k,sign)=>{const s=fmt(k,sign),i=s.lastIndexOf(',');return esc(s.slice(0,i))+'<small>'+esc(s.slice(i))+'</small>'};
function parseAmt(str){let s=String(str).replace(/[^\d.,]/g,'');if(!s)return NaN;
  if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  const v=Math.round(parseFloat(s)*100);return Number.isFinite(v)?v:NaN}
const amtInput=k=>k?(k/100).toLocaleString('tr-TR',{minimumFractionDigits:k%100?2:0,maximumFractionDigits:2,useGrouping:false}):'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const curYM=()=>today().slice(0,7);
const shiftYM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);return iso(d).slice(0,7)};
const ymLabel=ym=>AY[+ym.slice(5)-1]+' '+ym.slice(0,4);
const dParts=s=>({y:+s.slice(0,4),m:+s.slice(5,7),d:+s.slice(8,10)});
const dayLabel=s=>{const p=dParts(s);return p.d+' '+AY[p.m-1]};
const dowLabel=s=>{const p=dParts(s);return GUN[new Date(p.y,p.m-1,p.d).getDay()]};
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime());

/* ───── veri ───── */
const DB={months:{},settings:null};
let DEMO=null,col=null,DL=null,DICT=null,TTS=null,SAMPLE=null;
const st={mode:'loading',slow:false,readonly:false,ym:curYM(),tab:'defter',demo:false,edit:null,delArm:false,
  flt:{type:'all',method:'all',cat:'all',q:'',day:null},form:{type:'gider',method:'kart',cat:{},cu:''},rp:'ay',last:[],aiText:'',aiBusy:false};
const pend={},wq={};
const M=()=>st.demo?DEMO.months:DB.months;
const S=()=>st.demo?DEMO.settings:(DB.settings||(DB.settings=defSettings()));
const cats=()=>S().cats;
const catOf=id=>cats().find(c=>c.id===id)||{id,n:'Silinmiş kategori',t:'gider',k:9,x:true};
const monthTx=ym=>Object.values(M()[ym]||{});
const allTx=()=>Object.keys(M()).flatMap(monthTx);
const other=m=>m==='nakit'?'kart':'nakit';

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;const b=$('toasts');b.appendChild(el);while(b.children.length>2)b.firstChild.remove();setTimeout(()=>el.remove(),3200)}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY));return d&&d.months?d:null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({months:DB.months,settings:DB.settings}))}catch(e){toast('Bu tarayıcı kayıt saklamaya izin vermiyor. Gizli sekmede olabilirsin.')}}
function normSettings(s){if(!s||!Array.isArray(s.cats))return null;const d=clone(s);d.bud=d.bud||{};d.open=Object.assign({nakit:0,kart:0},d.open||{});d.cust=Array.isArray(d.cust)?d.cust:[];return d}

function docBody(id){if(id==='ayarlar')return DB.settings?clone(DB.settings):null;const m=DB.months[id.slice(3)];return m&&Object.keys(m).length?{items:clone(m)}:null}
function commit(ids){
  if(st.mode==='local'){saveLocal();return}
  if(st.mode!=='cloud')return;
  ids.forEach(id=>{const body=docBody(id);pend[id]={body};const q=wq[id]||(wq[id]={busy:false});q.next={body};if(!q.busy)runWrite(id)})}
async function runWrite(id){const q=wq[id];q.busy=true;
  while(q.next){const job=q.next;q.next=null;
    try{if(job.body)await col.doc(id).set(job.body);else await col.doc(id).delete();if(pend[id]&&pend[id].body===job.body)delete pend[id]}
    catch(e){delete pend[id];q.next=null;const c=e&&e.code;
      if(c==='invalid_argument'){st.readonly=true;toast('Bu hesapla kayıt yazılamıyor. Değişiklik saklanmadı.')}
      else if(c==='quota_exceeded')toast('Depolama alanı doldu. Eski ayları yedekleyip silmen gerekiyor.')
      else toast('Kaydedilemedi. Bağlantını kontrol edip tekrar dene.');
      renderAll()}}
  q.busy=false}
function applyDoc(id,body){if(id==='ayarlar'){DB.settings=normSettings(body)}else if(id.startsWith('ay-')){const ym=id.slice(3);if(body&&body.items&&Object.keys(body.items).length)DB.months[ym]=clone(body.items);else delete DB.months[ym]}}
function startCloud(db,uid){
  st.mode='cloud-loading';renderAll();
  try{col=db.collection('data/users/'+uid)}catch(e){startLocal();return}
  const timer=setTimeout(()=>{st.slow=true;renderStatus()},10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);st.slow=false}
    DB.months={};DB.settings=null;
    snap.docs.forEach(d=>applyDoc(d.id,d.data()));
    Object.keys(pend).forEach(id=>applyDoc(id,pend[id].body));
    st.mode='cloud';renderAll(true);
  },err=>{clearTimeout(timer);st.slow=false;if(st.mode!=='cloud'){st.mode='error'}else{st.readonly=true}renderAll()});
}
function startLocal(){const d=loadLocal();if(d){DB.months=d.months||{};DB.settings=normSettings(d.settings)}st.mode='local';renderAll(true)}

/* ───── kayıt işlemleri ───── */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function upsert(tx,oldDate){const ym=tx.d.slice(0,7),ids=['ay-'+ym];
  if(oldDate&&oldDate.slice(0,7)!==ym){const o=oldDate.slice(0,7);if(DB.months[o]){delete DB.months[o][tx.id];if(!Object.keys(DB.months[o]).length)delete DB.months[o]}ids.push('ay-'+o)}
  (DB.months[ym]||(DB.months[ym]={}))[tx.id]=tx;commit(ids)}
function removeTx(tx){const ym=tx.d.slice(0,7);if(DB.months[ym]){delete DB.months[ym][tx.id];if(!Object.keys(DB.months[ym]).length)delete DB.months[ym]}commit(['ay-'+ym])}
function saveSettings(){S();commit(['ayarlar'])}
function findTx(id){for(const ym in M()){if(M()[ym][id])return M()[ym][id]}return null}

/* ───── hesaplar ───── */
function stats(ym){const r={inc:0,out:0,cat:{},icat:{},meth:{nakit:0,kart:0},imeth:{nakit:0,kart:0},dayOut:{},dayInc:{},n:0,max:null};
  monthTx(ym).forEach(t=>{r.n++;
    if(t.t==='gider'){r.out+=t.a;r.cat[t.c]=(r.cat[t.c]||0)+t.a;r.meth[t.m]+=t.a;r.dayOut[t.d]=(r.dayOut[t.d]||0)+t.a;if(!r.max||t.a>r.max.a)r.max=t}
    else if(t.t==='gelir'){r.inc+=t.a;r.icat[t.c]=(r.icat[t.c]||0)+t.a;r.imeth[t.m]+=t.a;r.dayInc[t.d]=(r.dayInc[t.d]||0)+t.a}});
  return r}
function wallet(){const o=S().open||{},w={nakit:o.nakit||0,kart:o.kart||0};
  allTx().forEach(t=>{if(t.t==='gelir')w[t.m]+=t.a;else if(t.t==='gider')w[t.m]-=t.a;else{w[t.m]-=t.a;w[other(t.m)]+=t.a}});return w}
const elapsed=ym=>{const c=curYM();return ym===c?+today().slice(8):ym<c?daysIn(ym):1};

/* ───── çizim ───── */
function renderStatus(){const el=$('status');let c='',t='';
  if(st.demo){c='warn';t='Örnek veriler gösteriliyor'}
  else if(st.mode==='loading'||st.mode==='cloud-loading'){t=st.slow?'Kayıtlara henüz ulaşılamadı, deneniyor':'Kayıtlar yükleniyor'}
  else if(st.mode==='error'){c='bad';t='Kayıtlara ulaşılamıyor'}
  else if(st.readonly){c='bad';t='Yalnızca okunabilir'}
  else if(st.mode==='cloud'){c='ok';t=st.slow?'Bağlantı zayıf, veriler eski olabilir':'Hesabına kaydediliyor'}
  else{c='warn';t='Yalnızca bu tarayıcıda saklanıyor'}
  el.className=c;el.lastElementChild.textContent=t}
const ready=()=>st.mode==='cloud'||st.mode==='local';
function renderSum(){const s=stats(st.ym),w=wallet(),net=s.inc-s.out;
  $('monLbl').textContent=ymLabel(st.ym);
  $('sum').innerHTML=(st.demo?`<div class="demo"><span>Bunlar örnek kayıtlar, senin defterine yazılmadı.</span><button class="btn sm" data-act="demo" data-v="0">Örnekleri kapat</button></div>`:'')
   +`<p class="eyebrow">${ymLabel(st.ym)} · net</p><div class="net ${net<0?'neg':''}">${moneyHtml(net,true)}</div>
    <dl class="io"><div><dt>Gelir</dt><dd class="in">${fmt(s.inc)}</dd></div><div><dt>Gider</dt><dd class="out">${fmt(s.out)}</dd></div><div><dt>Günlük ortalama gider</dt><dd>${fmt(Math.round(s.out/elapsed(st.ym)))}</dd></div></dl>
    <div class="wallet"><span class="cash">${IC.cash}Eldeki nakit <b>${fmt(w.nakit)}</b></span><span class="card">${IC.card}Kartta <b>${fmt(w.kart)}</b></span></div>`}
function renderTabs(){$('tabs').innerHTML=[['defter','Defter'],['analiz','Analiz'],['butce','Bütçe'],['rapor','Rapor']].map(t=>`<button role="tab" aria-selected="${st.tab===t[0]}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}

function filtered(){const f=st.flt,q=f.q.trim().toLocaleLowerCase('tr');
  return monthTx(st.ym).filter(t=>(f.type==='all'||t.t===f.type)&&(f.method==='all'||t.m===f.method||(t.t==='aktarim'))&&(f.cat==='all'||t.c===f.cat)&&(!f.day||t.d===f.day)&&(!f.cu||t.cu===f.cu)
    &&(!q||((t.n||'')+' '+(t.t==='aktarim'?'aktarım':catOf(t.c).n)+' '+(t.cu?custOf(t.cu).n:'')).toLocaleLowerCase('tr').includes(q)))
   .sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0))}
function rowHtml(t){
  if(t.t==='aktarim')return `<button class="it" data-act="edit" data-v="${t.id}"><i class="dot" style="--c:var(--mute)"></i><span class="l1"><span class="nm">Aktarım</span><i class="lead"></i></span><b class="amt">${IC.swap}${fmt(t.a)}</b><span class="nt">${t.m==='kart'?'Karttan nakde':'Nakitten karta'}${t.n?' · '+esc(t.n):''}</span></button>`;
  const c=catOf(t.c),g=t.t==='gider',nt=[t.cu?custOf(t.cu).n:'',t.n||''].filter(Boolean).join(' · ');
  return `<button class="it" data-act="edit" data-v="${t.id}"><i class="dot" style="--c:var(--c${c.k%PAL})"></i><span class="l1"><span class="nm">${esc(c.n)}</span><i class="lead"></i></span><b class="amt ${g?'':'in'}">${t.m==='nakit'?IC.cash:IC.card}${fmt(g?-t.a:t.a,true)}</b>${nt?`<span class="nt">${esc(nt)}</span>`:''}</button>`}
function listHtml(){
  if(!ready())return `<div class="empty"><h3>Defter açılıyor</h3><p>Kayıtların getiriliyor. Birkaç saniye içinde burada gün gün listelenecek.</p></div>`;
  const all=monthTx(st.ym),items=filtered();
  if(!all.length)return `<div class="empty"><h3>${ymLabel(st.ym)} için henüz kalem yok</h3><p>Harcadığın ya da kazandığın her tutarı kategori, ödeme şekli ve notuyla buraya yaz. Gün gün toplanır, ay sonunda nereye gittiğini görürsün.</p><div class="acts"><button class="btn pri" data-act="fnew">İlk kaydı ekle</button>${st.demo?'':'<button class="btn" data-act="demo" data-v="1">Örnek verilerle gör</button>'}</div></div>`;
  if(!items.length)return `<div class="empty"><h3>Bu süzgece uyan kalem yok</h3><p>Aramayı ya da seçili süzgeçleri değiştir.</p><div class="acts"><button class="btn" data-act="fclear">Süzgeçleri temizle</button></div></div>`;
  let h='',cur=null,out=0,inc=0;const dt={};
  items.forEach(t=>{const o=dt[t.d]||(dt[t.d]={o:0,i:0});if(t.t==='gider'){o.o+=t.a;out+=t.a}else if(t.t==='gelir'){o.i+=t.a;inc+=t.a}});

    const k=t.d.slice(0,7),m=DB.months[k]||(DB.months[k]={});if(!m[t.id]){n++}m[t.id]={id:String(t.id),d:t.d,t:t.t,a:Math.round(t.a),m:t.m==='nakit'?'nakit':'kart',n:String(t.n||'').slice(0,140),ts:t.ts||Date.now(),...(t.c?{c:String(t.c)}:{}),...(t.cu?{cu:String(t.cu)}:{})};ids.add('ay-'+k)})});

  /* tür */
  const incSig=B.some(w=>INC_X.has(w)||INC_S.some(s=>w.startsWith(s)))||low.includes('ödeme aldım')||low.includes('para aldım');

    if(!cat){const pref=type==='gider'?'g12':(cu||newCu)?'i2':'i3';cat=(pool.find(c=>c.id===pref)||pool[pool.length-1]||{}).id||null}}

  const words=[];T.forEach((w,i)=>{const b=B[i];if(used.has(i)||!b||STOPW.has(b)||cuWords.includes(b))return;
    if(/^(nakit|peşin|elden|kart|kredi|banka|havale|eft)/.test(b)||INC_X.has(b)||EXP_W.includes(b)||b==='gelir'||b==='geliri'||b==='gideri'||b==='kazandım'||b.startsWith('çektim')||b==='yatırdım')return;words.push(w)});
  let note=words.join(' ').trim();if(cat&&note.toLocaleLowerCase('tr')===catOf(cat).n.toLocaleLowerCase('tr'))note='';

function say(html){$('cmdOut').innerHTML=html?`<div class="ln">${html}</div>`:''}

function runCmd(text,viaMic){text=String(text||'').trim();if(!text)return;
  if(!ready()||st.readonly){say('Defter henüz hazır değil. Birkaç saniye sonra tekrar dene.');return}
  const low=text.toLocaleLowerCase('tr');

  const parts=text.split(/;|,\s|\sve\s|\ssonra\s/).map(s=>s.trim()).filter(Boolean);let segs=[],carry='';
  parts.forEach(p=>{const t=(carry?carry+' ':'')+p;if(parseSeg(t).a!=null){segs.push(t);carry=''}else carry=t});
  if(carry&&segs.length)segs[segs.length-1]+=' '+carry;
  if(!segs.length){const s=stats(st.ym),w=wallet();let ans='';
    if(low.includes('rapor')||low.includes('müşteri')){st.tab='rapor';renderTabs();renderView();ans='Müşteri ve gelir raporu açıldı.';$('tabs').scrollIntoView({block:'start',behavior:'smooth'})}
    else if(/harca|gider|masraf/.test(low))ans=`${ymLabel(st.ym)} gideri ${fmt(s.out)}. Günlük ortalama ${fmt(Math.round(s.out/elapsed(st.ym)))}.`;
    else if(/gelir|kazan/.test(low))ans=`${ymLabel(st.ym)} geliri ${fmt(s.inc)}, net ${fmt(s.inc-s.out,true)}.`;
    else if(/bakiye|nakit|kart|param/.test(low))ans=`Eldeki nakit ${fmt(w.nakit)}, kartta ${fmt(w.kart)}.`;
    if(ans){say(esc(ans));speak(ans.replace(/₺([\d.]+),(\d\d)/g,(m,l,k)=>l.replace(/\./g,'')+' lira'+(k==='00'?'':' '+(+k)+' kuruş')),viaMic)}
    else{say('Tutarı anlayamadım. Şöyle söyleyebilirsin: <b>“kartla 250 lira market”</b> ya da <b>“Ahmet Bey\'den 5.000 lira geldi”</b>.');speak('Tutarı anlayamadım. Tekrar söyler misin?',viaMic)}
    return}
  leaveDemo();
  let pd=null,pm=null;const made=[];
  segs.forEach(sg=>{const p=parseSeg(sg);if(p.a==null)return;const d=p.d||pd||today(),m=p.m||pm||(p.type==='gelir'?'kart':st.form.method);pd=p.d||pd;pm=p.m||pm;
    const tx={id:newId(),d,t:p.type,a:p.a,m,n:p.note,ts:Date.now()+made.length};

  const T={gider:'gider',gelir:'gelir',aktarim:'aktarım'};
  $('cmdOut').innerHTML=made.map(t=>`<div class="ln"><span>${t.t==='aktarim'?IC.swap:t.m==='nakit'?IC.cash:IC.card} <b>${fmt(t.a)}</b> ${T[t.t]} · ${t.t==='aktarim'?(t.m==='kart'?'karttan nakde':'nakitten karta'):esc(catOf(t.c).n)}${t.cu?' · '+esc(custOf(t.cu).n):''} · ${dateWord(t.d)}${t.n?' · “'+esc(t.n)+'”':''}</span><span class="sp"></span><button class="lnk" data-act="edit" data-v="${t.id}">Düzelt</button></div>`).join('')
    +`<div><button class="lnk" data-act="undo">${made.length>1?'Hepsini geri al':'Geri al'}</button></div>`;
  speak(made.map(t=>`${spoken(t.a)} ${t.t==='aktarim'?'aktarım':catOf(t.c).n+(t.t==='gelir'?' geliri':' gideri')}`).join(', ')+' kaydedildi.',viaMic)}

function webDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  const H={p:[],f:[],s:[]};let rec=null,on=false,stopRes=null;const emit=(k,v)=>H[k].forEach(f=>{try{f(v)}catch(e){}});
  return{onPartial:f=>{H.p.push(f);return()=>{}},onFinal:f=>{H.f.push(f);return()=>{}},onState:f=>{H.s.push(f);return()=>{}},active:()=>on,
    start(){if(on)return Promise.resolve();return new Promise((res,rej)=>{let reason='stopped',started=false;
      try{rec=new SR()}catch(e){rej({code:'unavailable'});return}
      rec.lang='tr-TR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
      rec.onstart=()=>{started=true;on=true;emit('s',{state:'listening'});res()};
      rec.onresult=ev=>{let part='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i],t=r[0].transcript;if(r.isFinal){emit('p',{text:''});emit('f',{text:' '+t.trim()})}else part+=t}if(part)emit('p',{text:part.trim()})};
      rec.onerror=ev=>{const e=ev.error;reason=e==='not-allowed'||e==='service-not-allowed'?'not_granted':e==='no-speech'||e==='aborted'?'stopped':e==='language-not-supported'?'unavailable':'upstream_error';if(!started)rej({code:reason==='stopped'?'stopped':reason})};
      rec.onend=()=>{on=false;rec=null;emit('s',{state:'idle',reason});if(stopRes){stopRes();stopRes=null}};
      emit('s',{state:'starting'});
      try{rec.start()}catch(e){rej({code:'upstream_error'})}})},
    stop(){if(!rec)return Promise.resolve();return new Promise(r=>{stopRes=r;try{rec.stop()}catch(e){r()}})}}}
function webTTS(){if(!('speechSynthesis' in window))return null;
  return{speak(t){return new Promise(res=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';
    const v=speechSynthesis.getVoices().find(x=>/^tr/i.test(x.lang));if(v)u.voice=v;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}catch(e){res()}})}}}
